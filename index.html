<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asternova — Space Memorial</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #05060a;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    padding: 28px 24px 48px;
    overflow: hidden;
  }

  .hero-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .hero-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 40%;
    filter: brightness(1.25) contrast(1.15);
    display: block;
  }

  .hero-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(5, 6, 10, 0.75) 0%,
      rgba(5, 6, 10, 0.25) 22%,
      rgba(5, 6, 10, 0.10) 40%,
      rgba(5, 6, 10, 0.75) 62%,
      rgba(5, 6, 10, 0.94) 82%,
      rgba(5, 6, 10, 0.98) 100%
    );
  }

  .logo {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    margin-bottom: auto;   /* ВЕРНУЛ: прижимает текст с кнопкой к низу */
  }

  .logo .main {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.3em;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.9);
  }

  .logo .sub {
    font-size: 7px;
    letter-spacing: 0.6em;
    color: #d0d5e0;
    text-transform: uppercase;
    margin-top: 8px;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
  }

  .red-dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    background: #e63946;
    border-radius: 50%;
    margin-left: 4px;
    vertical-align: middle;
    transform: translateY(-1px);
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  .offer {
    font-size: 34px;
    font-weight: 300;
    line-height: 1.18;
    color: #fff;
    max-width: 320px;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.95);
  }

  .offer .accent {
    color: #e63946;
  }

  .sub-offer {
    margin-top: 18px;
    font-size: 14px;
    font-weight: 300;
    line-height: 1.5;
    color: #c8cedd;
    max-width: 300px;
    letter-spacing: 0.02em;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
  }

  .cta {
    display: inline-block;
    margin-top: 44px;   /* БЫЛО 30px — сдвинул кнопку ниже */
    padding: 18px 38px;
    background: #fff;
    color: #05060a;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 2px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
  }

  .cta:active { opacity: 0.7; }
</style>
</head>
<body>

  <section class="hero">

    <div class="hero-bg">
      <img src="rocket.jpg" alt="Запуск ракеты">
    </div>

    <div class="logo">
      <span class="main">Asternova<span class="red-dot"></span></span>
      <span class="sub">Space Memorial</span>
    </div>

    <div class="content">
      <h1 class="offer">
        Память о близком —<br><span class="accent">на орбите</span> Земли
      </h1>
      <p class="sub-offer">
        Сервис отправки праха усопшего на околоземную орбиту
      </p>
      <a href="#" class="cta">Обсудить</a>
    </div>

  </section>

</body>
</html>
